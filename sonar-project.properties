sonar.projectKey=yassine808_assist
sonar.organization=yassine808
sonar.projectName=RiotSwitcher
sonar.sourceEncoding=UTF-8

# Whole repository; the scan action runs on every push to main, so automatic
# analysis is disabled in SonarCloud and CI is the only writer.
sonar.sources=src,scripts,Website,tools,build,.github
sonar.tests=tests
sonar.exclusions=node_modules/**,out/**,release/**,build/pyinstaller/**,coverage/**,data/**,dist/**,**/*.min.js

# ProfileGrid's drag surface cannot be a native <button>: the card it wraps has
# its own buttons, and nested native buttons are invalid HTML. The wrapper is a
# labelled, focusable div with role="button" on purpose (see the comment there),
# so S6819 is ignored for that one file instead of degrading the card markup.
#
# verify-legacy-feed.mjs fetches two public manifests and the public release
# assets they name. Every URL is compared with the expected GitHub release
# prefix before it is used, and there is no request routing: it is a local CLI,
# not a server. S5144/S8476 assume a server that builds URLs from request input,
# which this file does not have.
sonar.issue.ignore.multicriteria=s6819,s5144-legacy,s8476-legacy
sonar.issue.ignore.multicriteria.s6819.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.s6819.resourceKey=src/renderer/src/components/ProfileGrid.tsx
sonar.issue.ignore.multicriteria.s5144-legacy.ruleKey=jssecurity:S5144
sonar.issue.ignore.multicriteria.s5144-legacy.resourceKey=scripts/verify-legacy-feed.mjs
sonar.issue.ignore.multicriteria.s8476-legacy.ruleKey=jssecurity:S8476
sonar.issue.ignore.multicriteria.s8476-legacy.resourceKey=scripts/verify-legacy-feed.mjs
