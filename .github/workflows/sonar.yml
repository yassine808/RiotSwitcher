name: SonarQube

# One of the three standing checks (with Updater and Site). SonarCloud's
# automatic analysis is off for this project: this workflow is the only writer,
# so a scan that does not run is visible as a missing check instead of being
# silently replaced by the GitHub app.
#
# The quality gate itself stays on the SonarCloud dashboard. It is not enforced
# here yet: the gate requires 80% coverage on new code and the project does not
# produce a coverage report, so enforcing it would fail every run at 0%.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scanner can blame lines and compute new code.
          fetch-depth: 0
      - name: Scan
        # Pinned by commit (v8.5.1): a moved tag would change what runs here.
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
