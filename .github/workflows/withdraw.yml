name: Withdraw

# Moves GitHub's "latest release" pointer back to an older release, so
# releases/latest/download serves the last good version to both updaters. Use it
# from the Actions tab (Run workflow) when a published build must stop being
# offered.
#
# It does NOT downgrade anyone: both updaters only move forward, so a client
# already on the bad version sees the older manifest as not newer and stays put.
# Withdrawal limits the blast radius; repairing those clients still needs a
# higher version published normally. See docs/UPDATES.md section 7.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to fall back to (must be a published release)
        required: true
      dry_run:
        description: Check and print only, do not move the pointer
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Shared with release.yml: the latest pointer is a single mutable resource and
  # two runs must not write it at the same time.
  group: release-feed
  cancel-in-progress: false

env:
  FEED_URL: https://github.com/yassine808/RiotSwitcher/releases/latest/download

jobs:
  withdraw:
    name: Move the latest pointer
    runs-on: windows-latest
    steps:
      - name: Check the version can be used
        # Everything that can be wrong is checked before the pointer moves: the
        # shape of the input, that the target release is public and complete,
        # and that it really is older than what the feed serves today.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "version must look like 3.1.11, got '$env:VERSION'"
          }
          $target = gh release view "v$env:VERSION" --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($target.isDraft) { throw "release v$env:VERSION is still a draft" }
          if ($target.isPrerelease) { throw "release v$env:VERSION is a prerelease and cannot be latest" }
          $assets = @($target.assets.name)
          foreach ($name in @(
            "latest.yml",
            "latest.json",
            "RiotSwitcher-Setup-$env:VERSION.exe",
            "RiotSwitcher-$env:VERSION-portable.exe"
          )) {
            if ($assets -notcontains $name) { throw "release v$env:VERSION has no $name" }
          }
          $latest = gh api "repos/${{ github.repository }}/releases/latest" | ConvertFrom-Json
          $current = $latest.tag_name.TrimStart("v")
          if ([version]$env:VERSION -ge [version]$current) {
            throw "the feed already serves $current; $env:VERSION is not older, so there is nothing to withdraw"
          }
          "latest release is v$current; would move the pointer to v$env:VERSION"

      - name: Move the latest pointer
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: gh release edit "v$env:VERSION" --latest

      - name: Verify the feed now serves that version
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: pwsh
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $deadline = (Get-Date).AddSeconds(60)
          $feed = $null
          do {
            try {
              $feed = Invoke-RestMethod "$env:FEED_URL/latest.json?t=$(Get-Date -UFormat %s)"
              if ($feed.version -eq $env:VERSION) { break }
            } catch {
              # The redirect may still point at the previous release for a
              # moment; retrying separates propagation from a failed edit.
            }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if ($null -eq $feed -or $feed.version -ne $env:VERSION) {
            throw "the feed reports $($feed.version), expected $env:VERSION"
          }
          if (-not $feed.files.portable.url.EndsWith("RiotSwitcher-$env:VERSION-portable.exe")) {
            throw "latest.json points at $($feed.files.portable.url)"
          }
          $yml = (Invoke-WebRequest "$env:FEED_URL/latest.yml?t=$(Get-Date -UFormat %s)" -UseBasicParsing).Content
          if ($yml -notmatch "(?m)^version:\s*$([regex]::Escape($env:VERSION))\s*$") {
            throw "latest.yml does not declare $env:VERSION"
          }
          "the feed now serves $env:VERSION"
