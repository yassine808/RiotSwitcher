name: Release

# Building the Windows artifacts is the app's "deployment": the installer and
# portable exe are published as a GitHub Release, and electron-builder also
# writes latest.yml. The public release is the update feed itself, so a client
# reads https://github.com/yassine808/RiotSwitcher/releases/latest/download/.
# Pushing a v* tag is the normal trigger; workflow_dispatch exists to rebuild an
# existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

concurrency:
  # One writer for the feed. A withdrawal (withdraw.yml) shares this group: two
  # runs must never interleave on the latest pointer, whichever started first
  # wins.
  group: release-feed
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  # Keep in step with the PyInstaller used for local builds (6.16.0).
  PYINSTALLER_VERSION: "6.16.0"
  # Certificate selection for scripts/package.mjs. Both stay empty until a
  # certificate exists; docs/SIGNING.md covers the provider setup. Once one is
  # set, verify-signatures.mjs makes an unsigned release a hard failure.
  WINDOWS_CERT_SHA1: ${{ secrets.WINDOWS_CERT_SHA1 }}
  WINDOWS_CERT_SUBJECT: ${{ secrets.WINDOWS_CERT_SUBJECT }}

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Python dependencies
        # Quoted: the bare ":all:" contains a space-colon, which YAML reads as
        # a nested mapping and rejects (same trap as ci.yml). requirements-dev
        # supplies pytest for the gate below; the release build itself only
        # needs requirements.txt.
        run: "python -m pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt pyinstaller==${{ env.PYINSTALLER_VERSION }}" # NOSONAR

      - name: Install Node dependencies
        run: npm ci

      # The backend tests the tag already passed in CI, but the release build
      # must not silently skip them if it is dispatched against an old tag.
      - name: Run the gate
        # bash with `set -e`: on the default PowerShell shell a failing native
        # command does not stop the step, so a red vitest run used to be
        # followed by pytest and a green exit code, publishing anyway.
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run test
          python -m pytest tests/ -q

      # The updater is pinned and its full wiring is checked (see
      # scripts/check-updater.mjs). CI already enforces this on main; checking
      # again here stops a tag built from a modified updater from being
      # published to every installed copy.
      - name: Verify the updater
        run: npm run check:updater

      - name: Restore the bundled API key
        # build/embed-env.mjs seals .env into two artifacts (env.bin and the
        # main-process shard). Without this the release would ship with no key
        # and every install would fall back to the anonymous rate limit.
        if: ${{ env.HENRIKDEV_API_KEY != '' }}
        shell: bash
        env:
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
        run: echo "HENRIKDEV_API_KEY=$HENRIKDEV_API_KEY" > .env

      - name: Build the Python backend
        run: npm run build:py

      - name: Build the Electron app
        # `prebuild` runs build/embed-env.mjs, which seals the .env restored
        # above into build/env.bin + the main-process shard. electron-builder
        # then packs out/ from this step; without it the asar has no entry file.
        run: npm run build

      - name: Start the code-signing agent
        # Provider-specific (Certum SimplySign, SSL.com eSigner, ...). Optional:
        # the build also accepts a certificate already installed on the runner.
        # The script reads its own credentials from secrets; see
        # docs/SIGNING.md for what it has to do.
        if: ${{ hashFiles('scripts/signing-agent.ps1') != '' }}
        shell: pwsh
        run: ./scripts/signing-agent.ps1

      - name: Package the app
        # Publish is handled by the next steps: electron-builder's own publisher
        # creates one release per target, which races and splits the assets
        # across two drafts on the same tag. scripts/package.mjs adds the
        # certificate overrides; with none configured the build is unsigned.
        run: node scripts/package.mjs --win --publish never
        env:
          # The certificate comes from the store, never from auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Add the stable Setup.exe download alias
        # README links to releases/latest/download/RiotSwitcher-Setup.exe, a URL
        # that cannot carry the version. The versioned installer stays the one
        # latest.yml names; this is a byte-for-byte copy for humans.
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setup = "release/RiotSwitcher-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "missing $setup" }
          Copy-Item $setup "release/RiotSwitcher-Setup.exe" -Force

      - name: Build the portable update manifest
        # latest.json carries the portable exe's URL, size and sha256; the
        # portable build reads it instead of latest.yml, which needs a YAML
        # parser it does not ship. Built before the release is published so the
        # release keeps a copy: withdrawing it later needs both manifests.
        run: node scripts/make-update-manifest.mjs

      - name: Verify the signatures
        # A signing failure must stop the release, not publish an unsigned
        # installer. REQUIRE_SIGNING turns on as soon as a certificate is
        # configured; an unsigned build only warns.
        env:
          REQUIRE_SIGNING: ${{ secrets.WINDOWS_CERT_SHA1 != '' || secrets.WINDOWS_CERT_SUBJECT != '' }}
        run: npm run verify:signatures

      - name: Verify the release before it is published
        # The last gate. Everything the feed will serve is checked here: the
        # tag names this version, the updater source still matches its lock, the
        # packaged app carries the live feed URL, and both manifests match the
        # files byte for byte. GitHub rewrites spaces in release asset names, so
        # a manifest naming a file that is not in release/ is a 404 and the app
        # never updates.
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: npm run verify:release

      - name: Publish the release
        # Draft first: the latest pointer must never expose a release whose
        # assets are still uploading. Everything a client can request is in the
        # release before it is made public.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $files = @(Get-ChildItem release -File |
            Where-Object {
              $_.Name -match '\.(exe|blockmap)$' -or
              $_.Name -eq 'latest.yml' -or
              $_.Name -eq 'latest.json'
            } |
            ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "no release artifacts in release/" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            gh release edit $tag --draft=false --latest
          } else {
            gh release create $tag --draft --verify-tag --title "RiotSwitcher $tag" --generate-notes
            gh release upload $tag @files --clobber
            gh release edit $tag --draft=false --latest
          }

      - name: Verify the live feed
        # Upload is only half of publishing: this reads the public URL back the
        # way both updaters do. Manifests on this version, binaries behind them
        # with the declared size, and the portable's sha256. A stale edge copy is
        # retried, not excused.
        # VERIFY_DOWNLOAD also hashes the portable: a client only notices a
        # corrupt object after downloading all 127 MB and then refuses it, so
        # the bytes are checked here instead of by every user.
        env:
          VERIFY_DOWNLOAD: "1"
        run: npm run verify:feed

      # No upload-artifact step: the GitHub release carries the installer, its
      # blockmap, the portable and both manifests. Archiving ~265 MB per run as
      # well only burned the account's artifact quota.
